languages: [en, am]
visuals: shared
output_name: lions-whisker-9x16
width: 352
height: 640
fps: 24
# Generated in portrait at 352x640, rendered as exact 9:16 (a 2% top and bottom crop).
output_size: {width: 720, height: 1280}
comfyui:
  url: http://127.0.0.1:8188
providers:
  script: [claude-cli]
  translation:
    - {name: claude-cli, options: {model: claude-opus-5-5}}
    - {name: claude-cli, options: {model: claude-sonnet-5-5}}
  storyboard: [claude-cli]
  # Amharic via Addis AI (needs ADDIS_API_KEY); English via Edge TTS. Chosen after user tests found the Edge voice robotic.
  narration: {name: addis-ai, options: {amharic_voice: am-hamen}}
  keyframes:
    name: comfyui-keyframer
    options:
      settings: {reference_megapixels: 0.25}
  video:
    name: comfyui-i2v
    options:
      settings: {width: 352, height: 640}
  music:
    name: comfyui-music
    options:
      settings: {bpm: 76, keyscale: A minor}
end_card: {seconds: 5}
# English subtitles on the Amharic render (the brief asks for English subtitles).
subtitles: {text_language: en}
mix: {loudness_lufs: -14}
