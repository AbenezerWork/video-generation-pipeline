# Sample project: every stage uses a fake provider (no GPU, no network).
languages: [en, am]
visuals: shared
output_name: demo
providers:
  script: fake-text
  translation: fake-translation
  storyboard: fake-text
  narration: fake-tts
  keyframes: fake-keyframer
  video: fake-i2v
  music: fake-music
# Real keyframes on a running ComfyUI (README, "Keyframes on ComfyUI"): set
# `keyframes: comfyui-keyframer` above, and a size the model draws:
# width: 832
# height: 480
# comfyui:
#   url: http://127.0.0.1:8188   # the default
# Optional (shown with their defaults); see "Assembly, ducking and subtitles" in the README.
# subtitles:
#   burn_in: true
#   fonts_dir: null              # default: ./fonts if it exists, else the fonts bundled with vidpipe
#   fonts: {am: Noto Sans Ethiopic}
#   font_size: 20                # libass units: the video's height is 288
# mix:
#   music_level: 0.4             # music gain while nobody speaks
#   duck_ratio: 8                # how hard narration pushes the music down
