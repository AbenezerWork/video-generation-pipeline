[project]
name = "vidpipe"
version = "0.1.0"
description = "Provider-pluggable studio pipeline for short video"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "filelock>=4.3.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[project.scripts]
vidpipe = "vidpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Everything under src/vidpipe ships, including the UI's static front end
# (src/vidpipe/ui/static: tokens, scripts, style page, woff2 fonts and their licences).
packages = ["src/vidpipe"]

# Ship the bundled fonts (and their licence) and the ComfyUI workflows inside the package:
# `vidpipe.subtitles` and `vidpipe.comfy.workflow` find them there.
[tool.hatch.build.targets.wheel.force-include]
"assets/fonts" = "vidpipe/_fonts"
"workflows" = "vidpipe/_workflows"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "needs_ffmpeg: needs real ffmpeg/ffprobe via VIDPIPE_FFMPEG_DIR or PATH",
    "integration: real providers (ComfyUI, CLIs, edge-tts); opt in with -m integration",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]
