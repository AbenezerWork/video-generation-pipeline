[project]
name = "vidpipe"
version = "0.1.0"
description = "Provider-pluggable studio pipeline for short video"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[project.scripts]
vidpipe = "vidpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "needs_ffmpeg: needs real ffmpeg/ffprobe on PATH (skipped cleanly when absent)",
    "integration: real providers (ComfyUI, CLIs, edge-tts); opt in with -m integration",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]
